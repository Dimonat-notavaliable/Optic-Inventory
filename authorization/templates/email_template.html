<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
 <body>
  <div class="mx-auto border rounded" style="max-width: 800px;">
      <div style="background-color: #1A180F;" class="d-flex justify-content-center rounded-top p-2">
          <img src="https://i.ibb.co/cCsMZmY/2024-03-06-210549729.png" style="max-width: 30%;" alt="optic-inventory">
      </div>
      <div class="d-flex flex-column text-center p-2">
          <h1 class="mb-2">Зарегистрирован новый пользователь</h1>
          <p class="mb-2">В системе был зарегистрирован пользователь {{ name }} с Email: {{ email }}</p>
          <p class="mb-2">Для того, чтобы он мог зайти в систему, перейдите по ссылке и смените его статус на "Активен"</p>
          <a href="https://www.google.com/search?client=opera&q=html+link&sourceid=opera&ie=UTF-8&oe=UTF-8"><button class="btn btn-success">Перейти</button></a>
      </div>
      <div style="background-color: #1A180F;" class="d-flex justify-content-center rounded-bottom p-2">
          <img src="http://127.0.0.1:8000/users/search={{search}}" style="max-width: 30%; opacity: 0;" alt="optic-inventory">
      </div>
  </div>
 </body>
</html>
