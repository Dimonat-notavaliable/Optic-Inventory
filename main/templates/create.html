{% extends 'base.html'%}
{% block title %}
    {{ title }}
{% endblock %}
{% block content %}
    <h5 class="my-3">{{title}}</h5>
    <hr class="m-0">
    <form method="POST" enctype="multipart/form-data" class="my-3">
        {% csrf_token %}
        {{ form.as_p }}
        <hr>
        <input type="submit" class="btn btn-green" value="Сохранить">
        <a href="{{request.META.HTTP_REFERER|escape}}" class="btn btn-gray">Отмена</a>
    </form>
{% endblock %}
{% block additional_script %}
<script>
    Swatchy();
</script>
{% endblock %}
